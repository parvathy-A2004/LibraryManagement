{% extends 'base.html' %}

{% block title %}
{% if form.instance.id %}
Edit Student
{% else %}
Add Student
{% endif %}
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <h2 class="text-primary mb-4">
        {% if form.instance.id %}
            Edit Student
        {% else %}
            Add Student
        {% endif %}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save
        </button>

        <a href="{% url 'student_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
