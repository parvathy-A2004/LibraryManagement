{% extends 'base.html' %}

{% block title %}
Add Book
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-primary mb-4">Add New Book</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save Book
        </button>

    </form>

</div>

{% endblock %}
